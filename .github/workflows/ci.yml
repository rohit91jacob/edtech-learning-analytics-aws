name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LOCKED: "1"
  PYTHON_VERSION: "3.12"
  TERRAFORM_VERSION: "1.16.5"
  TFLINT_VERSION: "v0.64.0"
  CHECKOV_VERSION: "3.3.26"
  FIXTURES: tests/fixtures/oulad

jobs:
  lint:
    name: lint, lockfile, secrets, py3.9 compat
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: uv.lock is in sync with pyproject.toml
        run: uv lock --check
      - run: uv sync --only-group dev --no-install-project
      - name: ruff check
        run: uv run --no-sync ruff check --output-format=github .
      - name: ruff format
        run: uv run --no-sync ruff format --check .
      - name: Spark job modules compile on Python 3.9 (the EMR 7.x runtime)
        run: uv run --no-project --python 3.9 python -m py_compile src/edtech_analytics/spark/*.py
      - name: gitleaks (full history)
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --verbose
      - name: no committed file over 300 KB
        run: |
          big=$(git ls-files -z | xargs -0 -I{} find {} -maxdepth 0 -size +300k)
          if [ -n "$big" ]; then echo "$big"; exit 1; fi

  unit:
    name: unit tests (no JVM; moto for S3/KMS/Step Functions)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest tests/unit -q

  pipeline:
    name: pipeline on fixtures (Spark + Iceberg + dbt build + rerun)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EDTECH_DATA_DIR: /tmp/edtech-fixtures
      EDTECH_SOURCE_MD5: none
      EDTECH_SPARK_MASTER: local[2]
      EDTECH_SPARK_DRIVER_MEMORY: 2g
      EDTECH_LOG_FORMAT: json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Cache the Iceberg runtime jar
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ivy2
          key: ivy-iceberg-1.10.1-${{ runner.os }}
      - run: uv sync --frozen
      - name: Spark + dbt tests (e2e, idempotent rerun, DQ gate stops bad data)
        run: uv run pytest tests/spark --cov --cov-report=term --cov-report=xml --durations=10
      - name: Full pipeline via the CLI (state machine -> model -> verify -> site)
        run: uv run edtech pipeline --archive "$FIXTURES" --report site
      - name: dbt build again on the same warehouse (idempotent)
        run: uv run edtech dbt build
      - name: EMR Serverless artefacts
        run: uv run edtech package-emr --out dist/emr
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fixture-site-and-coverage
          path: |
            site
            coverage.xml
            dist/emr

  dbt-athena:
    name: dbt compile for Athena (offline) + Trino parse
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --extra athena
      - name: Compile (every AWS endpoint points at a closed local port)
        run: make athena-compile

  terraform:
    name: terraform fmt / validate / tflint / checkov
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - run: tflint --init && tflint --recursive --config "$PWD/.tflint.hcl"
      - name: checkov (skips are justified inline)
        run: uvx --from "checkov==${CHECKOV_VERSION}" checkov -d . --framework terraform --quiet --compact

  localstack:
    name: LocalStack integration (S3 landing + Step Functions)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      localstack:
        # Last community (no auth token) release, pinned by digest.
        image: localstack/localstack:4.14.0@sha256:3ebc37595918b8accb852f8048fef2aff047d465167edd655528065b07bc364a
        ports:
          - 4566:4566
        env:
          SERVICES: s3,stepfunctions,sns,iam,sts,kms
        options: >-
          --health-cmd "curl -fs http://localhost:4566/_localstack/health"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      EDTECH_AWS_ENDPOINT_URL: http://localhost:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: eu-west-2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -m localstack tests/integration -v
