version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    # pyspark tracks the Spark version of the EMR release in infra/ (emr-7.14.0 = Spark 3.5.8);
    # bump both together, deliberately.
    ignore:
      - dependency-name: pyspark
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: terraform
    directory: /infra
    schedule:
      interval: weekly
