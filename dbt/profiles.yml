edtech:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('EDTECH_DUCKDB_PATH', '../data/warehouse.duckdb') }}"
      threads: "{{ env_var('EDTECH_DUCKDB_THREADS', '4') | int }}"
      extensions: [iceberg]
      settings:
        memory_limit: "{{ env_var('EDTECH_DUCKDB_MEMORY_LIMIT', '4GB') }}"
    ci:
      type: duckdb
      path: "{{ env_var('EDTECH_DUCKDB_PATH', '../data/warehouse_ci.duckdb') }}"
      threads: 2
      extensions: [iceberg]
      settings:
        memory_limit: "{{ env_var('EDTECH_DUCKDB_MEMORY_LIMIT', '2GB') }}"
    # Real AWS target. CI only compiles it (no credentials, no queries); see docs/runbook.md.
    athena:
      type: athena
      region_name: "{{ env_var('AWS_REGION', 'eu-west-2') }}"
      database: awsdatacatalog
      schema: "{{ env_var('EDTECH_ATHENA_SCHEMA', 'edtech_dev') }}"
      s3_staging_dir: "{{ env_var('EDTECH_ATHENA_STAGING_DIR', 's3://edtech-dev-athena-results-placeholder/dbt/') }}"
      s3_data_dir: "{{ env_var('EDTECH_ATHENA_DATA_DIR', 's3://edtech-dev-lake-placeholder/warehouse/dbt/') }}"
      s3_data_naming: schema_table_unique
      work_group: "{{ env_var('EDTECH_ATHENA_WORKGROUP', 'edtech-dev') }}"
      threads: 4
      num_retries: 2
